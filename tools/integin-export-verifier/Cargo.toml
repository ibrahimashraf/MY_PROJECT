[package]
name = "integin-export-verifier"
version = "0.1.0"
edition = "2021"
description = "Read-only Export Manifest v1 verifier (did:integin evidence exports)"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
strip = true