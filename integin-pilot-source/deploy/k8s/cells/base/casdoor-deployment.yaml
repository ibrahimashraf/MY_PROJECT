apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor-iam
  namespace: cell-system
  labels:
    app.kubernetes.io/name: casdoor-iam
    app.kubernetes.io/part-of: integin-sovereign-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor-iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor-iam
    spec:
      containers:
        - name: casdoor
          image: casbin/casdoor:latest
          env:
            - name: driverName
              value: "postgres"
            - name: dataSourceName
              valueFrom:
                secretKeyRef:
                  name: casdoor-db-credentials
                  key: data-source-name
            - name: origin
              value: "https://auth.integin.com"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 389
              name: ldap
            - containerPort: 1812
              name: radius
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/get-account
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/get-account
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: casdoor-iam
  namespace: cell-system
  labels:
    app.kubernetes.io/name: casdoor-iam
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
    - port: 389
      targetPort: ldap
      name: ldap
    - port: 1812
      targetPort: radius
      name: radius
  selector:
    app.kubernetes.io/name: casdoor-iam
