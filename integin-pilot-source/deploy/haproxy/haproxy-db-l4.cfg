# HAProxy L4 TCP Configuration for PostgreSQL & Connection Pooler High Availability
# Supports PgBouncer / PgDog Pooler routing with dynamic name resolution fallback

global
    log stdout format raw local0 info
    maxconn 20000

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 3000ms
    timeout client  300000ms
    timeout server  300000ms
    retries 3
    # Dynamic DNS resolution without crashing if an optional container is starting
    default-server init-addr last,libc,none

# -------------------------------------------------------------
# FRONTEND 1: PostgreSQL Direct Primary Write (:5000)
# -------------------------------------------------------------
frontend fe_pg_primary
    bind *:5000
    default_backend be_pg_primary

backend be_pg_primary
    mode tcp
    balance roundrobin
    option tcp-check
    default-server init-addr last,libc,none check inter 3000ms fall 3 rise 2 maxconn 5000
    server pg_primary appliance-postgres:5432 check

# -------------------------------------------------------------
# FRONTEND 2: Read Replicas / Connection Pooler (:5001)
# -------------------------------------------------------------
frontend fe_pg_pooler
    bind *:5001
    default_backend be_pg_pooler

backend be_pg_pooler
    mode tcp
    balance roundrobin
    default-server init-addr last,libc,none check inter 3000ms fall 3 rise 2 maxconn 5000
    server pgbouncer_pooler integin-pgbouncer:6432 check
    server pg_fallback      appliance-postgres:5432 check backup

# -------------------------------------------------------------
# OBSERVABILITY: DB Proxy Stats & Prometheus Metrics (:8405)
# -------------------------------------------------------------
frontend fe_db_stats
    mode http
    bind *:8405
    acl is_metrics path /metrics
    http-request use-service prometheus-exporter if is_metrics
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:integin_db_stats_admin
