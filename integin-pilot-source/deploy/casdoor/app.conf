# Casdoor Sovereign Identity Provider Configuration
# Pure FOSS Appliance Deployment with PostgreSQL, Sovereign RustFS S3, and HAProxy Ingress

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = postgres
dataSourceName = "host=appliance-casdoor-postgres port=5432 user=casdoor_owner password=casdoor_sovereign_secret dbname=casdoor_appliance sslmode=disable"
dbName = casdoor_appliance
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider = provider_storage_rustfs
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = ""
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin = "http://appliance-casdoor:8000"
originFrontend = ""
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
defaultApplication = "integin-live-matrix"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "integin-pilot"
radiusSecret = "sovereign_radius_secret_2026"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"
