<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGIN — Local Offline Markdown & Engineering Document Viewer</title>

<!-- Standard CDNs (cached offline once loaded) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.2.4/dist/mermaid.min.js"></script>

<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --table-header: #020617;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: #020617;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.15s;
  }
  .btn:hover {
    background: var(--accent);
    color: #020617;
    border-color: var(--accent);
  }
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    overflow: hidden;
  }
  .pane {
    overflow-y: auto;
    padding: 24px;
    height: 100%;
  }
  .editor-pane {
    background: #090d16;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    color: #e2e8f0;
    border: none;
    padding: 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
  }
  .preview-pane {
    background: var(--bg);
    line-height: 1.6;
  }
  /* Markdown Content Styling */
  .preview-pane h1, .preview-pane h2, .preview-pane h3 {
    color: var(--accent);
    margin: 20px 0 10px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .preview-pane h1 { font-size: 22px; }
  .preview-pane h2 { font-size: 18px; }
  .preview-pane h3 { font-size: 15px; }
  .preview-pane p { margin: 10px 0; }
  .preview-pane table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 13px;
    background: var(--panel);
  }
  .preview-pane th, .preview-pane td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .preview-pane th {
    background: var(--table-header);
    color: var(--accent);
  }
  .preview-pane img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin: 12px 0;
    background: #000;
  }
  .preview-pane [dir="rtl"], .preview-pane p:has(span[lang="ar"]), .arabic-text {
    direction: rtl;
    text-align: right;
    font-family: "Segoe UI", "Tahoma", sans-serif;
  }
  .drop-zone {
    border: 2px dashed var(--accent);
    background: rgba(56, 189, 248, 0.05);
  }
</style>
</head>
<body>

<header>
  <h1>👁️ INTEGIN Markdown & Lifting Document Viewer</h1>
  <div class="controls">
    <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none;">
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Open .md File</button>
    <button class="btn" onclick="loadPipelineCorpus()">🔄 Load pipeline_output/corpus.md</button>
    <button class="btn" onclick="toggleLayout()">↔️ Toggle Single/Split</button>
  </div>
</header>

<div class="main" id="workspace">
  <div class="editor-pane" id="left-pane">
    <textarea id="markdown-input" placeholder="Paste markdown or drag & drop a .md file here..."></textarea>
  </div>
  <div class="preview-pane pane" id="right-pane">
    <div id="preview-content"></div>
  </div>
</div>

<script>
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });

  const inputEl = document.getElementById('markdown-input');
  const previewEl = document.getElementById('preview-content');

  function renderMarkdown() {
    const raw = inputEl.value;
    // 1. GFM Parse
    previewEl.innerHTML = marked.parse(raw);

    // 2. KaTeX Math Render
    renderMathInElement(previewEl, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });

    // 3. Mermaid Diagrams
    const mermaidBlocks = previewEl.querySelectorAll('code.language-mermaid');
    mermaidBlocks.forEach((block, idx) => {
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = block.textContent;
      block.parentElement.replaceWith(container);
    });
    mermaid.run({ nodes: previewEl.querySelectorAll('.mermaid') });

    // 4. Arabic RTL Auto-Detection
    const arabicRe = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
    previewEl.querySelectorAll('p, td, li, h1, h2, h3').forEach(el => {
      if (arabicRe.test(el.textContent)) {
        el.setAttribute('dir', 'rtl');
      }
    });
  }

  inputEl.addEventListener('input', renderMarkdown);

  // File drag & drop
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop-zone'); });
  window.addEventListener('dragleave', () => document.body.classList.remove('drop-zone'));
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('drop-zone');
    if (e.dataTransfer.files.length > 0) {
      readFile(e.dataTransfer.files[0]);
    }
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    if (e.target.files.length > 0) readFile(e.target.files[0]);
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      inputEl.value = e.target.result;
      renderMarkdown();
    };
    reader.readAsText(file);
  }

  // Load pipeline_output/corpus.md directly via fetch
  async function loadPipelineCorpus() {
    try {
      const res = await fetch('pipeline_output/corpus.md');
      if (!res.ok) throw new Error('Could not fetch corpus.md');
      inputEl.value = await res.text();
      renderMarkdown();
    } catch (e) {
      alert('Could not auto-fetch pipeline_output/corpus.md directly via browser file protocol. Please click "Open .md File" or Drag & Drop pipeline_output/corpus.md into this window!');
    }
  }

  let isSplit = true;
  function toggleLayout() {
    const ws = document.getElementById('workspace');
    const lp = document.getElementById('left-pane');
    isSplit = !isSplit;
    if (isSplit) {
      ws.style.gridTemplateColumns = '1fr 1fr';
      lp.style.display = 'flex';
    } else {
      ws.style.gridTemplateColumns = '1fr';
      lp.style.display = 'none';
    }
  }

  // Initial demo load
  inputEl.value = `# Document Loaded\\n\\nDrag and drop \`pipeline_output/corpus.md\` here to preview tables, KaTeX equations, Arabic text, and inline photos.`;
  renderMarkdown();
</script>
</body>
</html>
