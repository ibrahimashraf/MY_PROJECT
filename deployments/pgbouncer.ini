[databases]
integin_pilot = host=postgres port=5432 dbname=integin_pilot user=integin_runtime password=${DB_PASSWORD}

[pgbouncer]
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 10
reserve_pool_timeout = 5
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60