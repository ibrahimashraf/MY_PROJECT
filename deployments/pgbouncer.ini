[databases]
integin_appliance = host=appliance-postgres port=5432 dbname=integin_appliance auth_user=integin_owner
integin_migration_test = host=appliance-postgres port=5432 dbname=integin_migration_test auth_user=postgres

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 1000
default_pool_size = 80
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100
ignore_startup_parameters = extra_float_digits,default_query_exec_mode
admin_users = postgres,integin_owner