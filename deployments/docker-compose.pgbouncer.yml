version: '3.8'

services:
  # pgbouncer: 2-Clause BSD Permissive Connection Pooler (Zero AGPL Copyleft Risk)
  # Standard lightweight connection pooler with strict DISCARD ALL session reset
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1
    container_name: integin-pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 64M