apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: integin-haproxy-ingress
  namespace: cell-system
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: integin-sovereign-mesh
  annotations:
    kubernetes.io/ingress.class: "haproxy"
    haproxy.org/ssl-redirect: "true"
    haproxy.org/ssl-redirect-port: "443"
    haproxy.org/rate-limit-requests: "100"
    haproxy.org/rate-limit-period: "10s"
    haproxy.org/response-set-header: |
      Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
      X-Frame-Options "DENY"
      X-Content-Type-Options "nosniff"
      Referrer-Policy "strict-origin-when-cross-origin"
    haproxy.org/backend-config-snippet: |
      compression algo gzip deflate
      compression type text/html text/plain text/css application/javascript application/json
spec:
  tls:
    - hosts:
        - api.integin.com
        - auth.integin.com
        - verify.integin.com
      secretName: integin-cell-tls-secret
  rules:
    - host: api.integin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: integin-server
                port:
                  number: 8080
    - host: auth.integin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casdoor-iam
                port:
                  number: 8000
    - host: verify.integin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: integin-server
                port:
                  number: 8080
