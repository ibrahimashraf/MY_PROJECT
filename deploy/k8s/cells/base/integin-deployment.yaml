apiVersion: apps/v1
kind: Deployment
metadata:
  name: integin-server
  namespace: cell-system
  labels:
    app.kubernetes.io/name: integin-server
    app.kubernetes.io/part-of: integin-sovereign-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: integin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integin-server
    spec:
      affinity:
        # Strict physical node pinning to sovereign geographic cell
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: integin.com/sovereign-cell
                    operator: Exists
        # Anti-affinity ensuring high availability across failure domains within the cell
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - integin-server
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: integin-server
          image: integin/integin-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-api
          env:
            - name: INTEGIN_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: INTEGIN_SOVEREIGN_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: cell-config
                  key: cell.id
            - name: INTEGIN_JURISDICTION_CODE
              valueFrom:
                configMapKeyRef:
                  name: cell-config
                  key: jurisdiction.code
            - name: INTEGIN_DATA_RESIDENCY_POLICY
              valueFrom:
                configMapKeyRef:
                  name: cell-config
                  key: residency.policy
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: integin-server
  namespace: cell-system
  labels:
    app.kubernetes.io/name: integin-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: integin-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
