# HAProxy 3.1 Configuration for INTEGIN Sovereign Edge Appliance Stack
# Defense-in-Depth against DDoS, Token Enumeration, Credential Stuffing & Reverse Proxy Routing
# Ingress routing: INTEGIN Monolith API + Casdoor Sovereign IAM + RustFS S3 / Console + Prometheus Exporter

global
    log stdout format raw local0 info
    maxconn 50000
    tune.bufsize 32768
    tune.maxrewrite 2048
    tune.ssl.default-dh-param 2048

    # Modern TLS Security Configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11

    # Local runtime stats socket
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor header X-Forwarded-For
    option  http-server-close

    timeout connect 5000ms
    timeout client  60000ms
    timeout server  60000ms
    timeout http-keep-alive 10000ms
    timeout http-request    10000ms
    retries 3

# -------------------------------------------------------------
# DEDICATED STICK-TABLE BACKENDS (Dual Rate-Limiting Addon)
# -------------------------------------------------------------
backend st_auth_abuse
    stick-table type ip size 100k expire 10m store http_req_rate(60s)

# -------------------------------------------------------------
# ADDON: In-Memory Static Asset Edge Cache (RAM Shield)
# -------------------------------------------------------------
cache static_cache
    total-max-size 16
    max-age 86400
    max-object-size 2097152

# -------------------------------------------------------------
# FRONTEND: Ingress Edge Gateway (HTTP :80 & HTTPS :443)
# -------------------------------------------------------------
frontend fe_integin_public
    bind *:80
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/integin-appliance.pem alpn h2,http/1.1

    # Addon: Static Asset RAM Edge Cache (immutable frontend assets)
    filter cache static_cache
    acl is_static_asset path_end -i .js .css .svg .png .ico .woff .woff2 .ttf
    acl is_assets_path  path_beg /assets/
    http-request set-var(txn.is_static) bool(true) if is_static_asset or is_assets_path
    http-request cache-use static_cache if { var(txn.is_static) -m bool }
    http-response cache-store static_cache if { var(txn.is_static) -m bool }

    # Addon: Stateless HTTP Compression Filter
    filter compression
    compression algo gzip deflate
    compression type text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml

    # Addon: Security Headers (OWASP Top 10 hardening)
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" if { ssl_fc }
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # Addon: WAF Rule 1 - Path Traversal Shield
    acl is_path_traversal path -m sub ..
    http-request deny deny_status 400 if is_path_traversal

    # Addon: WAF Rule 2 - Malicious Scanner Shield
    acl is_bad_scanner hdr_sub(User-Agent) -i sqlmap nikto dirbuster gobuster wpscan masscan acunetix
    http-request deny deny_status 403 if is_bad_scanner

    # Addon: Stick-Table 1 - Global IP Rate Limiter & Connection Tracker
    stick-table type ip size 200k expire 5m store http_req_rate(10s),conn_rate(10s),http_err_rate(10s)
    http-request track-sc0 src

    # Addon: Stick-Table 2 - Anti-Brute-Force for IAM Auth & Token Endpoints
    acl is_auth_endpoint path_beg /api/login /api/signin /api/signup /login/oauth/access_token /login/oauth/authorize
    http-request track-sc1 src table st_auth_abuse if is_auth_endpoint

    # DDoS & Brute-Force Throttle Enforcement
    http-request deny deny_status 429 if { sc0_http_req_rate gt 150 }
    http-request deny deny_status 429 if is_auth_endpoint { sc1_http_req_rate(st_auth_abuse) gt 30 }

    # Rate limit public certificate verifier
    acl is_cert_verifier path_beg /verify/certificates/
    http-request deny deny_status 429 if is_cert_verifier { sc0_http_req_rate gt 60 }

    # Addon: Prometheus Metrics & Health Check Path
    acl is_metrics_path path /metrics
    http-request use-service prometheus-exporter if is_metrics_path

    # Routing ACLs
    acl is_casdoor_path path_beg /casdoor /api/login /api/signin /api/signup /api/get-account /api/userinfo /api/device-auth /login/oauth /.well-known /swagger /api/webauthn
    acl is_casdoor_host hdr_beg(host) -i casdoor. iam. auth.
    acl is_s3_path      path_beg /s3
    acl is_s3_host      hdr_beg(host) -i s3.
    acl is_s3_console   path_beg /s3-console
    acl is_stats_path   path_beg /stats /haproxy-stats

    use_backend be_haproxy_stats   if is_stats_path
    use_backend be_casdoor_iam     if is_casdoor_path or is_casdoor_host
    use_backend be_rustfs_s3       if is_s3_path or is_s3_host
    use_backend be_rustfs_console  if is_s3_console
    default_backend be_integin_server

# -------------------------------------------------------------
# FRONTEND: Dedicated Observability & Metrics Gateway (:8404)
# -------------------------------------------------------------
frontend fe_observability
    bind *:8404
    mode http
    acl is_metrics path /metrics
    http-request use-service prometheus-exporter if is_metrics

    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats auth admin:integin_haproxy_admin
    stats admin if LOCALHOST

# -------------------------------------------------------------
# BACKENDS
# -------------------------------------------------------------

# 1. INTEGIN Monolith Core API Server
backend be_integin_server
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server check inter 3000ms fall 2 rise 2 maxconn 10000
    server integin_monolith appliance-integin-server:8080 check

# 2. Casdoor Sovereign IAM Identity Provider
backend be_casdoor_iam
    balance roundrobin
    option httpchk GET /api/get-account
    http-check expect status 200
    default-server check inter 3000ms fall 2 rise 2 maxconn 5000
    server casdoor_iam appliance-casdoor:8000 check

# 3. RustFS S3 Blob Storage API
backend be_rustfs_s3
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 5000ms fall 2 rise 2 maxconn 5000
    server rustfs_s3 appliance-rustfs:9000 check

# 4. RustFS S3 Web Console
backend be_rustfs_console
    balance roundrobin
    default-server check inter 5000ms fall 2 rise 2 maxconn 1000
    server rustfs_console appliance-rustfs:9001 check

# 5. HAProxy Embedded Stats Addon
backend be_haproxy_stats
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats auth admin:integin_haproxy_admin
