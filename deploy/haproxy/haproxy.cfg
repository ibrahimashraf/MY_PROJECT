# HAProxy Configuration for INTEGIN Global Trust Platform
# Defense-in-Depth against DDoS and Token Enumeration Brute-Force

global
    log stdout format raw local0 info
    maxconn 50000
    # Strict memory ceiling to ensure rock-solid RSS under volumetric attacks
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  30000ms
    timeout server  30000ms
    retries 3

# ----------------------------------------------------------------------
# Front-end Shield: Edge Entrypoint
# ----------------------------------------------------------------------
frontend fe_integin_public
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/integin.pem alpn h2,http/1.1

    # Security Headers
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # Forward real client IP to the Go backend
    option forwardfor header X-Forwarded-For

    # ------------------------------------------------------------------
    # Stick-Table 1: Track general HTTP request rate per IP (30s window)
    # ------------------------------------------------------------------
    stick-table type ip size 200k expire 5m store http_req_rate(30s)
    http-request track-sc0 src

    # ------------------------------------------------------------------
    # Stick-Table 2: Brute-Force Defense against Token Enumeration
    # Tracks count of HTTP 404 (Not Found) responses per IP (10s window)
    # If an attacker attempts > 10 invalid tokens in 10 seconds, BAN.
    # ------------------------------------------------------------------
    stick-table type ip size 100k expire 1h store http_err_rate(10s)
    http-response track-sc1 src if { status 404 } { path_beg /verify/certificates/ }

    # ------------------------------------------------------------------
    # Mitigation Rules
    # ------------------------------------------------------------------
    # Rule A: Block attacker IP if caught enumerating tokens (> 10 404s in 10s)
    # We reject at TCP layer immediately to eliminate HTTP parsing overhead
    tcp-request content reject if { sc1_http_err_rate gt 10 }

    # Rule B: Rate limit the public verifier endpoint (/verify/certificates/*)
    # Exceeding 60 requests in 30 seconds triggers 429 Too Many Requests
    acl is_cert_verifier path_beg /verify/certificates/
    http-request deny deny_status 429 content-type "application/json" string "{\"error\":\"rate_limit_exceeded\",\"retry_after_seconds\":30}" if is_cert_verifier { sc0_http_req_rate gt 60 }

    # Route clean traffic to Go sovereign monolith
    default_backend be_integin_server

# ----------------------------------------------------------------------
# Backend: INTEGIN Go Sovereign Monolith
# ----------------------------------------------------------------------
backend be_integin_server
    balance roundrobin
    option httpchk GET /readiness
    http-check expect status 200
    default-server check inter 3000ms fall 2 rise 2 maxconn 10000
    server integin_monolith host.docker.internal:8080 check
