# INTEGIN Sovereign Edge Appliance - pgBackRest Configuration
# Pure FOSS Disaster Recovery Architecture (Dual-NVMe Topology)
# NVMe Drive A: /var/lib/postgresql/data (Active PG 18 Cluster)
# NVMe Drive B: /mnt/nvme-backup/pgbackrest (Dedicated Immutable Stanza & WAL Stream)

[global]
repo1-path=/mnt/nvme-backup/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
process-max=4
log-level-console=info
log-level-file=detail
start-fast=y
compress-type=lz4
compress-level=3
archive-async=y
spool-path=/var/spool/pgbackrest

[global:archive-push]
compress-level=3

[integin-appliance]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
pg1-port=5432
