name: CGO & Architecture Boundary Guard

on:
  pull_request:
    paths:
      - 'integin-pilot-source/**/*.go'
      - 'integin-pilot-source/go.mod'
      - 'integin-pilot-source/go.sum'
  push:
    branches:
      - main
    paths:
      - 'integin-pilot-source/**/*.go'
      - 'integin-pilot-source/go.mod'
      - 'integin-pilot-source/go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cgo-guard:
    name: Pure Go & CGO_ENABLED=0 Invariant Gate
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: integin-pilot-source/go.sum

      - name: Assert Zero In-Process CGO Import Directives
        working-directory: integin-pilot-source
        run: |
          echo "Scanning codebase for forbidden 'import \"C\"'..."
          CGO_REFS=$(grep -rn --include="*.go" 'import "C"' . || true)
          if [ -n "$CGO_REFS" ]; then
            echo "::error::Found forbidden in-process cgo imports (violates DEC-RUST-02):"
            echo "$CGO_REFS"
            exit 1
          fi
          echo "Passed: 0 cgo imports found."

      - name: Lint Codebase (go vet)
        working-directory: integin-pilot-source
        run: |
          go vet ./...

      - name: Compile Statically Linked Server Binary (CGO_ENABLED=0)
        working-directory: integin-pilot-source
        run: |
          go build -v -ldflags="-s -w" -o bin/integin-server ./cmd/integin-server
          file bin/integin-server
          # Assert binary is statically linked with zero libc dynamic dependencies
          if ldd bin/integin-server 2>&1 | grep -q "not a dynamic executable"; then
            echo "Verified: Statically linked pure Go binary."
          elif ! ldd bin/integin-server 2>&1; then
            echo "Verified: Statically linked pure Go binary."
          fi

      - name: Execute Clean-Cache Unit Tests (CGO_ENABLED=0)
        working-directory: integin-pilot-source
        run: |
          go test -count=1 ./pkg/...
