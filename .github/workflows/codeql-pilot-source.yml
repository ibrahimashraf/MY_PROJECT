# CodeQL for the Go/Dart/Python codebase that lives on the `pilot-source`
# branch of this same repository (tracked from `main` as the integin-pilot-source
# submodule).
#
# Why this exists:
#   `main` contains zero .go files. All 942 live on `pilot-source`. CodeQL only
#   analyses files present in the runner's working directory, so scanning `main`
#   found no Go at all and failed with "not any written in Go".
#
# Why this file must ALSO exist on `pilot-source`:
#   GitHub only runs a workflow on branches that contain the workflow file.
#   This copy lives on `main`; an identical copy must be committed to
#   `pilot-source` or these triggers will never fire.
#
# PREREQUISITE: delete the GitHub-managed "CodeQL" default-setup workflow
# (Code security -> Code scanning -> CodeQL -> ... -> Delete) BEFORE enabling
# this, or two CodeQL workflows will upload competing SARIF for the same code.

name: "CodeQL (pilot-source)"

on:
  push:
    branches: ["pilot-source"]
  pull_request:
    branches: ["pilot-source"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      # One language failing must not suppress the other jobs' results.
      fail-fast: false
      matrix:
        include:
          # CodeQL has a Go extractor but no Dart or shell extractor; Dart is
          # covered by .github/workflows/unscanned-languages.yml instead.
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: autobuild
    steps:
      # No submodule init: this workflow runs ON pilot-source, so the Go module
      # is already the working directory. This is the whole point.
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          ram: high

      - uses: github/codeql-action/autobuild@v3
        if: matrix.build-mode != 'none'

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"